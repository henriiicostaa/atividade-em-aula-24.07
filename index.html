<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Lógico</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="calculadora">
        <h1>Calculadora</h1> <!-- Titulo - contém apenas 1 por página. -->
        <p id="preencha">Preencha os campos abaixos</p> <!-- Parágrafo -->

        <label>Primeiro número: </label>
        <input type="number" id="numero01" placeholder="Digite o primeiro número">

        <label>Operação: </label>

        <select id="operador">
            <option value="+">Soma</option>
            <option value="-">Subtração</option>
            <option value="*">Multiplicação</option>
            <option value="/">Divisão</option>
        </select>

        <label>Segundo número:</label>
        <input type="number" id="numero02" placeholder="Digite o segundo número">

        <button type="button" onclick="calcularNaTela()">Calcular Agora</button>

        <p id="tela-resultado">O resultado aparecerá aqui...</p>
    </div>
    <script src="calc.js"></script>
</body>

</html>
